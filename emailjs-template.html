<!--
  Paste this into EmailJS: Email Templates -> Create New Template -> Code editor (</>) view.
  Suggested template settings on the EmailJS dashboard:
    Subject:   New enquiry: {{matter_type}} - {{from_name}}
    To email:  ghulam.babar123@gmail.com
    Reply to:  {{reply_to}}
-->
<div style="background-color:#08080a;padding:32px 16px;font-family:Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;background-color:#0d0d0f;border:1px solid #c9a227;">
    <tr>
      <td style="padding:32px 36px 24px;border-bottom:1px solid rgba(201,162,39,0.35);">
        <div style="font-family:Georgia,'Times New Roman',serif;color:#e6cd72;font-size:12px;letter-spacing:3px;text-transform:uppercase;margin-bottom:6px;">
          Babar Law Associates
        </div>
        <div style="font-family:Georgia,'Times New Roman',serif;color:#ffffff;font-size:24px;line-height:1.3;">
          New consultation enquiry
        </div>
      </td>
    </tr>
    <tr>
      <td style="padding:28px 36px 8px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
          <tr>
            <td style="padding:10px 0;border-bottom:1px solid rgba(239,234,223,0.1);color:#c9a227;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;width:140px;vertical-align:top;">Matter</td>
            <td style="padding:10px 0;border-bottom:1px solid rgba(239,234,223,0.1);color:#efeadf;font-size:15px;vertical-align:top;">{{matter_type}}</td>
          </tr>
          <tr>
            <td style="padding:10px 0;border-bottom:1px solid rgba(239,234,223,0.1);color:#c9a227;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;vertical-align:top;">Name</td>
            <td style="padding:10px 0;border-bottom:1px solid rgba(239,234,223,0.1);color:#efeadf;font-size:15px;vertical-align:top;">{{from_name}}</td>
          </tr>
          <tr>
            <td style="padding:10px 0;border-bottom:1px solid rgba(239,234,223,0.1);color:#c9a227;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;vertical-align:top;">Email</td>
            <td style="padding:10px 0;border-bottom:1px solid rgba(239,234,223,0.1);vertical-align:top;">
              <a href="mailto:{{from_email}}" style="color:#e6cd72;font-size:15px;text-decoration:none;">{{from_email}}</a>
            </td>
          </tr>
          <tr>
            <td style="padding:10px 0;border-bottom:1px solid rgba(239,234,223,0.1);color:#c9a227;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;vertical-align:top;">Phone</td>
            <td style="padding:10px 0;border-bottom:1px solid rgba(239,234,223,0.1);color:#efeadf;font-size:15px;vertical-align:top;">{{phone}}</td>
          </tr>
          <tr>
            <td style="padding:10px 0;border-bottom:1px solid rgba(239,234,223,0.1);color:#c9a227;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;vertical-align:top;">Country</td>
            <td style="padding:10px 0;border-bottom:1px solid rgba(239,234,223,0.1);color:#efeadf;font-size:15px;vertical-align:top;">{{country}}</td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <td style="padding:20px 36px 4px;">
        <div style="color:#c9a227;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px;">Details</div>
        <div style="color:#efeadf;font-size:14.5px;line-height:1.7;white-space:pre-line;">{{details}}</div>
      </td>
    </tr>
    <tr>
      <td style="padding:20px 36px 32px;">
        <div style="color:#c9a227;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px;">Message</div>
        <div style="color:#efeadf;font-size:15px;line-height:1.8;white-space:pre-line;">{{message}}</div>
      </td>
    </tr>
    <tr>
      <td style="padding:20px 36px;background-color:#060608;border-top:1px solid rgba(201,162,39,0.3);">
        <div style="color:rgba(239,234,223,0.45);font-size:12px;">
          Sent from the consultation form at babarlawassociates.com
        </div>
      </td>
    </tr>
  </table>
</div>
